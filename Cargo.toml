[package]
name = "survivorsforge"
version = "0.6.3"
edition = "2024"
description = "Addon manager for Azeroth Survivors"
repository = "https://github.com/Rezondes/SurvivorsForge"
homepage = "https://rezondes.github.io/SurvivorsForge/"
license = "AGPL-3.0-or-later"

[workspace]
members = ["crates/*"]

[[bin]]
name = "SurvivorsForge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "crates/forge-core" }
forge-scan = { path = "crates/forge-scan" }
slint-toast = { path = "crates/slint-toast", features = ["slint"] }
slint ={ version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
rfd = "0.17"
trash = "5"
semver = "1"
open = "5"
sha2 = "0.11"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

# A game controller as keys (src/gamepad.rs): evdev on Linux needs no system library to build
# against, gilrs elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
# The Store version asks the Store for its updates (same version the other crates pull in).
windows = { version = "0.62", features = ["ApplicationModel", "Foundation_Collections", "Services_Store"] }

[build-dependencies]
slint-build = "1.18"
# Only for the folder of toast.slint; without its `slint` feature.
slint-toast = { path = "crates/slint-toast" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
# Lays the UI out without a window, for layout tests (same version as slint).
i-slint-backend-testing = "=1.18.1"

[profile.release]
strip = true
lto = "thin"

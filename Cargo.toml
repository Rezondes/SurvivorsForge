[package]
name = "survivorsforge"
version = "0.4.3"
edition = "2024"
description = "Addon manager for Azeroth Survivors"
repository = "https://github.com/Rezondes/SurvivorsForge"
homepage = "https://rezondes.github.io/SurvivorsForge/"
license = "AGPL-3.0-or-later"

[workspace]
members = ["crates/*"]

[[bin]]
name = "SurvivorsForge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "crates/forge-core" }
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
rfd = "0.17"
trash = "5"
semver = "1"
self-replace = "1.5"
open = "5"
sha2 = "0.11"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

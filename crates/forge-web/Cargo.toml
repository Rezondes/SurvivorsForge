[package]
name = "forge-web"
version = "0.1.0"
edition = "2024"
description = "Website of the SurvivorsForge platform, a client of forge-api"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["set-header"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-extra = { version = "0.12", features = ["cookie-private"] }
askama = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
rand = "0.9"
base64 = "0.23"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
wiremock = "0.6"

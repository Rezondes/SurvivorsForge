{% if c.releases.failed %}<p class="muted checks"><span class="failed">Update check failed <time datetime="{{ c.releases.last_run_at }}">{{ c.releases.last_run }}</time></span>, last success <time datetime="{{ c.releases.last_at }}">{{ c.releases.last }}</time> · next check <time datetime="{{ c.releases.next_at }}">{{ c.releases.next }}</time></p>
{% else %}<p class="muted checks">Updates checked <time datetime="{{ c.releases.last_at }}">{{ c.releases.last }}</time> · next check <time datetime="{{ c.releases.next_at }}">{{ c.releases.next }}</time></p>
{% endif %}

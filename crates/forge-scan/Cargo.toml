[package]
name = "forge-scan"
version = "0.2.2"
edition = "2024"
description = "Static security scanner for Azeroth Survivors addon zips"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
full_moon = "3"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

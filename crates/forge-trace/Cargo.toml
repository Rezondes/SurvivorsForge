[package]
name = "forge-trace"
version = "0.1.0"
edition = "2024"
description = "Logging and OpenTelemetry traces of the SurvivorsForge API, worker and website"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "internal-logs"] }
http = "1"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }

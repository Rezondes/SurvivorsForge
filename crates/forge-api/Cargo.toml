[package]
name = "forge-api"
version = "0.1.0"
edition = "2024"
description = "Backend API and worker of the SurvivorsForge platform"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
forge-scan = { path = "../forge-scan" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["catch-panic", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
rand = "0.9"
base64 = "0.23.1"
sha2 = "0.11.1"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
webp = { version = "0.3.1", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
http-body-util = "0.1"
rsa = "0.9"
tempfile = "3.27.0"
wiremock = "0.6"
image = { version = "0.25.10", default-features = false, features = ["png"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The launcher and the crates it shares, on both platforms it ships for.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: oldest glibc we ship against, same as the release build
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p survivorsforge -p forge-core -p forge-scan
      - run: cargo clippy -p survivorsforge -p forge-core -p forge-scan --all-targets -- -D warnings

  # The platform: API and website against a real Postgres, Linux only.
  platform:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Scanner speed (release build)
        run: cargo test -p forge-scan --release --test perf -- --ignored

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Compose file is valid with monitoring
        run: POSTGRES_PASSWORD=ci docker compose --profile monitoring config --quiet
      - name: Build the Grafana image
        run: POSTGRES_PASSWORD=ci docker compose -f compose.yaml -f compose.local.yaml --profile monitoring build grafana
      - name: Build the website image
        run: POSTGRES_PASSWORD=ci docker compose -f compose.yaml -f compose.local.yaml build web
      - name: Build and smoke-test the API stack
        run: bash scripts/compose-smoke.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

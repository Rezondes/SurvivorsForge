name: Release

# Two ways in: a tag `v*` pushed by hand, or the "Run workflow" button under Actions -> Release with
# the new version. The button sets it in Cargo.toml and Cargo.lock, commits, tags and pushes, and the
# jobs below build from that tag in the same run (a tag pushed with GITHUB_TOKEN starts no workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "New version without v, for example 0.5.2 or 0.6.0-rc.1"
        required: true

jobs:
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the version, commit, tag and push
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Write the version as 0.5.2 or 0.6.0-rc.1 (no v in front)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION exists already"
            exit 1
          fi
          # The first `version =` of Cargo.toml is the package's; in Cargo.lock the line after its name.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(\nname = "survivorsforge"\nversion = ")[^"]*/$1$ENV{VERSION}/' Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $VERSION" || echo "Cargo.toml had $VERSION already"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
      - name: Check tag matches Cargo.toml and Cargo.lock
        id: check
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          if ! grep -A1 '^name = "survivorsforge"$' Cargo.lock | grep -qx "version = \"$version\""; then
            echo "::error::Cargo.lock still has another version of survivorsforge than $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  # Asset names are what the self-update looks for, see src/self_update.rs.
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/SurvivorsForge.exe -DestinationPath "SurvivorsForge-${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SurvivorsForge-*.zip

  linux:
    needs: version
    # Oldest glibc we support (2.35), so the AppImage runs on SteamOS and current distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package AppImage
        run: bash packaging/linux/build-appimage.sh target/release/SurvivorsForge "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/SurvivorsForge-*.AppImage

  macos:
    needs: version
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p survivorsforge
      - name: Package app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash packaging/macos/build-app.sh target/release/SurvivorsForge "$VERSION" dist
          codesign --verify --strict dist/SurvivorsForge.app
          ditto -c -k --keepParent dist/SurvivorsForge.app dist/SurvivorsForge-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/SurvivorsForge-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  # Push the platform images only after all launcher builds succeed.
  images:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web, grafana]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Image name
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/survivorsforge-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.name }}
          # From the tag, also when the button started the run on main.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
          # `latest` (and `{{major}}.{{minor}}`) only for final versions, never for v0.4.0-rc.1 and the like.
          flavor: latest=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/forge-${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Publish once every launcher build and the platform images have succeeded.
  publish:
    needs: [version, windows, linux, macos, images]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      # Only the launcher builds: the image jobs leave build records (*.dockerbuild) as artifacts too,
      # and those cannot be downloaded this way. Not into the checkout's assets/: everything in this
      # folder is uploaded.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: release
      # What a server needs besides the images (docs/self-hosting.md).
      - name: Add the server files
        run: cp compose.yaml release/ && cp .env.example release/env.example
      # Fixed names only, for the self-update and direct links (releases/latest/download/<name>).
      # Launchers before 0.4.0 looked for the versioned names and must be downloaded again by hand.
      - name: Give the launchers their fixed names
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv "release/SurvivorsForge-$VERSION-x86_64-pc-windows-msvc.zip" release/SurvivorsForge-windows-x86_64.zip
          mv "release/SurvivorsForge-$VERSION-x86_64.AppImage" release/SurvivorsForge-linux-x86_64.AppImage
      # A tag with a hyphen (v0.4.0-rc.1) becomes a pre-release: GitHub's latest release, which the
      # launcher's self-update reads, skips it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # A final release lists everything since the previous final one (v0.3.2...v0.4.0), not just
        # since its last release candidate; a candidate lists what changed since the tag before it.
        run: |
          options=()
          if [[ "$TAG" == *-* ]]; then
            options=(--prerelease)
          elif previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            options=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" release/* "${options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SurvivorsForge ${{ needs.version.outputs.version }}" \
            --generate-notes

  # The Microsoft Store version: the same exe as an MSIX package, which the Store signs. Final
  # releases only, once the repository variables are set (README, "Microsoft Store"). It runs after
  # the GitHub release, so a Store problem never holds that back; re-run this job alone to retry.
  store:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false' && vars.MSSTORE_PRODUCT_ID != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: build
      - name: Pack the MSIX
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          Expand-Archive "build/SurvivorsForge-$env:VERSION-x86_64-pc-windows-msvc.zip" -DestinationPath msix
          Copy-Item -Recurse packaging/windows/Assets msix/Assets
          # The Store wants four numbers with 0 last: 0.6.0 becomes 0.6.0.0.
          (Get-Content packaging/windows/AppxManifest.xml -Raw).
            Replace('${IDENTITY_NAME}', $env:IDENTITY_NAME).
            Replace('${PUBLISHER}', $env:PUBLISHER).
            Replace('${PUBLISHER_DISPLAY_NAME}', $env:PUBLISHER_DISPLAY_NAME).
            Replace('${VERSION}', "$env:VERSION.0") | Set-Content msix/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d msix /p SurvivorsForge.msix /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # For the first submission, which is made by hand in Partner Center.
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: SurvivorsForge.msix
      - uses: microsoft/setup-msstore-cli@v1
        if: vars.MSSTORE_TENANT_ID != ''
      # Fails while an earlier submission is still in certification.
      - name: Submit to the Store
        if: vars.MSSTORE_TENANT_ID != ''
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msstore publish SurvivorsForge.msix -id $env:PRODUCT_ID
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

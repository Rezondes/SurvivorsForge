# SurvivorsForge platform. Values come from `.env` (see `.env.example`). This file and `.env` are
# all a server needs: the images come from ghcr.io, Caddy's configuration is below.
#
#   docker compose up -d                        everything
#   docker compose up -d postgres api worker    the API alone, without website and proxy
#   docker compose pull && docker compose up -d update to the newest release
#
# FORGE_VERSION pins a release (e.g. 0.3.2); without it `latest` runs. To build the images from
# this repository instead, add compose.local.yaml (docs/local-setup.md). For local development,
# compose.dev.yaml publishes Postgres on 127.0.0.1.

x-api: &api
  image: ghcr.io/rezondes/survivorsforge-api:${FORGE_VERSION:-latest}
  env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
    IMAGE_DIR: /data/images
    GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
    # Fixed addresses of Caddy and the website on the edge network; their X-Forwarded-For is trusted.
    TRUSTED_PROXIES: ${FORGE_CADDY_IP:-10.213.17.10},${FORGE_WEB_IP:-10.213.17.11}
    # The website limits each visitor itself; the API does not count its requests again.
    WEBSITE_IP: ${FORGE_WEB_IP:-10.213.17.11}
  secrets:
    - github-app.pem
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *api
    command: ["serve"]
    volumes:
      - images:/data/images
    networks:
      - backend
      - edge
      - monitoring
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-api", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *api
    command: ["worker"]
    # The API applies the migrations; the worker starts once they are in.
    depends_on:
      api:
        condition: service_healthy
    # Handles untrusted zips: no image volume, read-only file system, capped memory.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    # Builds addon packs; the only volume it writes.
    volumes:
      - packs:/data/packs
    networks:
      - backend
      - edge
      - monitoring
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-api", "healthcheck", "db"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/rezondes/survivorsforge-web:${FORGE_VERSION:-latest}
    env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
    environment:
      API_INTERNAL_URL: http://api:8080
      TRUSTED_PROXIES: ${FORGE_CADDY_IP:-10.213.17.10}
    networks:
      edge:
        # Fixed, so the API can trust the client IP the website forwards.
        ipv4_address: ${FORGE_WEB_IP:-10.213.17.11}
      monitoring: {}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-web", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
    # Plain HTTP: the website on 3080, the API on 3081 (the ports in DOMAIN_WEB and DOMAIN_API).
    # TLS ends in front of the server, e.g. at Cloudflare.
    ports:
      - "3080:3080"
      - "3081:3081"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - images:/srv/img:ro
      - packs:/srv/packs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${FORGE_CADDY_IP:-10.213.17.10}
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- Monitoring (`docker compose --profile monitoring up -d`) ----------------------------------
  # Metrics, logs and traces of the platform and its host, shown in Grafana. Nothing of it is
  # published on the host; it all lives on the internal network `monitoring`.
  prometheus:
    image: prom/prometheus:v3.7.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/forge.yaml"]
    configs:
      - source: loki
        target: /etc/loki/forge.yaml
    volumes:
      - loki:/loki
    networks:
      - monitoring
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo/forge.yaml"]
    # The image runs as 10001; a fresh volume belongs to root.
    user: root
    configs:
      - source: tempo
        target: /etc/tempo/forge.yaml
    volumes:
      - tempo:/var/tempo
    networks:
      - monitoring
    restart: unless-stopped

  # Lets Alloy list containers and read their logs, nothing else; Alloy never sees the socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    profiles: [monitoring]
    environment:
      CONTAINERS: 1
      # Alloy's container discovery also lists the networks.
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [monitoring]
    command: ["run", "/etc/alloy/forge.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      # Only this project's containers go to Loki.
      FORGE_PROJECT: ${COMPOSE_PROJECT_NAME}
    configs:
      - source: alloy
        target: /etc/alloy/forge.alloy
    networks:
      - monitoring
      - docker-proxy
    depends_on:
      - loki
      - docker-proxy
    restart: unless-stopped

  # Container metrics. cAdvisor reads the host's cgroups and Docker's state directly; no proxy
  # covers that, so it all is mounted read-only.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [monitoring]
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - monitoring
    restart: unless-stopped

  # Data sources and dashboards are built into the image (docker/forge-grafana.Dockerfile).
  grafana:
    image: ghcr.io/rezondes/survivorsforge-grafana:${FORGE_VERSION:-latest}
    profiles: [monitoring]
    env_file:
      - path: ${FORGE_ENV_FILE:-.env}
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Behind the website at /grafana/; Caddy checks the Forge login (`/auth/grafana`) and sends
      # the user in X-Grafana-User, which Grafana accepts from Caddy's address only.
      GF_SERVER_ROOT_URL: ${PUBLIC_WEB_URL:-http://localhost:3080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Grafana-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: ${FORGE_CADDY_IP:-10.213.17.10}
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      # Everyone who passes the check is a Forge admin.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - monitoring
      - backend
      # Where Caddy reaches it, from its fixed address.
      - edge
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

networks:
  # Postgres lives here only; nothing on it can reach the internet.
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${FORGE_EDGE_SUBNET:-10.213.17.0/24}
  # Prometheus, Grafana and what they read; no way out to the internet.
  monitoring:
    internal: true
  # The Docker socket proxy and Alloy only.
  docker-proxy:
    internal: true

volumes:
  postgres:
  images:
  packs:
  caddy-data:
  caddy-config:
  prometheus:
  loki:
  tempo:
  grafana:

# Caddy reads DOMAIN_WEB, DOMAIN_API and ACME_EMAIL from its environment (`$$` keeps Compose off them).
configs:
  caddyfile:
    content: |
      {
        email {$$ACME_EMAIL}
        # The visitor's address behind Cloudflare, NGINX Proxy Manager or another proxy on a private
        # network: CF-Connecting-IP, else the rightmost untrusted X-Forwarded-For entry, but only from
        # these senders. Ranges from https://www.cloudflare.com/ips/.
        servers {
          trusted_proxies static private_ranges 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
          trusted_proxies_strict
          client_ip_headers CF-Connecting-IP X-Forwarded-For
        }
      }

      {$$DOMAIN_WEB} {
        # Uploaded images straight from the volume; nothing outside /img/ is ever served from it.
        handle_path /img/* {
          root * /srv/img
          header Cache-Control "public, max-age=31536000, immutable"
          header X-Content-Type-Options nosniff
          file_server
        }
        # Built addon packs; the name is the SHA-256 of the pack's versions, so the file never changes.
        handle_path /packs-files/* {
          root * /srv/packs
          header Cache-Control "public, max-age=86400"
          header X-Content-Type-Options nosniff
          header Content-Disposition "attachment; filename=\"SurvivorsForge-pack.zip\""
          file_server
        }
        # Grafana (`--profile monitoring`). Its static files are public anyway; everything else
        # needs a Forge login with the right to see Grafana, checked by the website on each
        # request. Grafana takes the user name only from this header and only from Caddy.
        handle /grafana/public/* {
          reverse_proxy grafana:3000
        }
        handle /grafana* {
          request_header -X-Grafana-User
          forward_auth web:8080 {
            uri /auth/grafana
            copy_headers X-Grafana-User
          }
          reverse_proxy grafana:3000
        }
        handle {
          reverse_proxy web:8080 {
            header_up X-Forwarded-For {client_ip}
          }
        }
      }

      {$$DOMAIN_API} {
        reverse_proxy api:8080 {
          header_up X-Forwarded-For {client_ip}
        }
      }

  # What Prometheus scrapes; all inside the Compose networks.
  prometheus:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: forge
          static_configs:
            - targets: ["api:9100"]
              labels: { service: api }
            - targets: ["worker:9100"]
              labels: { service: worker }
            - targets: ["web:9100"]
              labels: { service: web }
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

  # Loki: one process, files on its volume, 14 days.
  loki:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 336h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      analytics:
        reporting_enabled: false

  # Tempo: OTLP from API, worker and website; traces stay 14 days.
  tempo:
    content: |
      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal

      compactor:
        compaction:
          block_retention: 336h

      usage_report:
        reporting_enabled: false

  # Alloy: the logs of this project's containers to Loki, labelled with their service.
  alloy:
    content: |
      discovery.docker "forge" {
        host = "tcp://docker-proxy:2375"
        filter {
          name   = "label"
          values = ["com.docker.compose.project=" + sys.env("FORGE_PROJECT")]
        }
      }

      discovery.relabel "forge" {
        targets = []

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "forge" {
        host          = "tcp://docker-proxy:2375"
        targets       = discovery.docker.forge.targets
        relabel_rules = discovery.relabel.forge.rules
        forward_to    = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

secrets:
  github-app.pem:
    file: ${GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github-app.pem}
